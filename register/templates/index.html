<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开心实验室登记</title>
    <!-- 引入 Google Fonts 中的 Poppins 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif; /* 使用 Poppins 字体 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        .form-container {
            width: 100%;
            max-width: 600px;  /* 限制表单宽度 */
            padding: 20px;
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            margin: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 500;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;  /* 圆角输入框 */
            font-size: 16px;
            font-family: 'Poppins', sans-serif;  /* 保持字体一致 */
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;  /* 圆角按钮 */
            font-size: 16px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }

        button:hover {
            background-color: #0056b3;
        }

        .form-actions {
            text-align: center;
        }

        .form-actions button {
            width: auto;
            background-color: #28a745;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>实验室设备使用登记</h1>
        <form id="usageForm">
            <label for="date">日期</label>
            <input type="date" id="date" name="date" required>

            <label for="class">班级</label>
            <input type="text" id="class" name="class" required>

            <label for="name">姓名</label>
            <input type="text" id="name" name="name" required>

            <label for="time">时间</label>
            <input type="time" id="time" name="time" required>

            <label for="content">使用内容</label>
            <textarea id="content" name="content" required></textarea>

            <div class="form-actions">
                <button type="submit">提交登记</button>
                <button type="button" onclick="exportData()">导出数据</button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('usageForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            fetch('/submit_usage', {
                method: 'POST',
                body: formData
            }).then(response => {
                if (response.ok) {
                    alert('登记成功!');
                } else {
                    alert('登记失败!');
                }
            });
        });

        function exportData() {
            window.location.href = '/export_to_excel';
        }
    </script>
</body>
</html>
